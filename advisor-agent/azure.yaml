# advisor-agent — Azure Developer CLI manifest
# Docs: https://learn.microsoft.com/azure/developer/azure-developer-cli/
#
# Two services:
#   agent — Node.js advisor agent, deployed as a Container App.
#           Container App + CAE are declared in infra/modules/container-apps.bicep.
#           AZD discovers the Container App via AZURE_CONTAINER_APP_NAME output.
#   web   — React SPA, deployed as an Azure Static Web App (Free tier).
#           SWA is declared in infra/modules/staticwebapp.bicep.
#
# Foundry Hosted Agent NOTE:
#   Foundry Hosted Agent Bicep coverage is in PREVIEW. The resource type is
#   currently a placeholder in infra/modules/foundry.bicep. The Container App
#   serves as the M0 runtime host. Foundry Hosted Agent wiring is deferred to
#   M1/M2 per decisions.md §foundry-hosted-agent-preview.
#
# Usage:
#   azd up          — provision + build + deploy all services
#   azd provision   — infra only (Bicep)
#   azd deploy      — build + push images, deploy services
name: advisor-agent

infra:
  provider: bicep
  path: ./infra
  module: main

services:
  agent:
    project: ./agent
    host: containerapp
    language: ts
    docker:
      path: ../Dockerfile
      context: ..
      remoteBuild: true

  web:
    project: ./web
    host: staticwebapp
    language: ts

hooks:
  # Pre-provision: migrate from Consumption-only CAE to VNet-integrated CAE.
  # Azure does not allow adding vnetConfiguration to an existing environment,
  # so we delete the old Consumption CAE (and its Container Apps) before
  # Bicep creates the new VNet-integrated one.
  # This is a one-time migration; subsequent provisions are idempotent.
  preprovision:
    shell: sh
    run: scripts/pre-provision.sh
    continueOnError: false
    interactive: false

  predeploy:
    shell: sh
    run: |
      npm install
      npm run build --workspace=agent
      VITE_ADVISOR_DEMO_MODE=false \
        VITE_ADVISOR_TENANT_ID=cdfe81b5-821e-4f07-9ea7-516efc8497e4 \
        VITE_ADVISOR_CLIENT_ID=4f4f4a4d-e60f-4b86-a681-86059aae4597 \
        VITE_AZURE_REDIRECT_URI="${STATIC_WEB_APP_URL}" \
        VITE_API_BASE_URL="${CONTAINER_APP_URL}" \
        npm run build --workspace=web
    continueOnError: false
    interactive: false
