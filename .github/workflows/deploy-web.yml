# Deploy advisor-agent Web SPA to Azure Static Web Apps
#
# Required repo secret (sensitive — set via gh secret set or GitHub UI):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — SWA deployment token from:
#     az staticwebapp secrets list -n advisor-web-uwmrjzgkhs2hk -g rg-advisor-dev --query properties.apiKey -o tsv
#
# Required repo variables (public — set via gh variable set or GitHub UI):
#   VITE_API_BASE_URL          — Container App base URL
#   VITE_ADVISOR_CLIENT_ID     — Entra app registration client ID
#   VITE_ADVISOR_TENANT_ID     — Entra tenant ID
#   VITE_AZURE_REDIRECT_URI    — SWA deployed URL (Entra redirect URI)
#
# Deploy flow: push to feat-ai-decision-agent or main → this action →
#   Node 20 build (npm ci && npm run build) → SWA deploy via Azure/static-web-apps-deploy@v1
#
# ARM aarch64 workaround: runs on ubuntu-latest (x86-64) because the SWA CLI
# StaticSitesClient binary is x86-64 only and fails on ARM codespaces (parker-4).

name: Deploy Web SPA to Azure Static Web Apps

on:
  push:
    branches:
      - feat-ai-decision-agent
      - main
    paths:
      - 'advisor-agent/web/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - feat-ai-decision-agent
      - main
    paths:
      - 'advisor-agent/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    name: Build and Deploy SPA
    runs-on: ubuntu-latest
    # Skip the deploy job on PR close — the close_pull_request_job handles cleanup
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'advisor-agent/web'
          output_location: 'dist'
          app_build_command: 'npm ci && npm run build'
          # api_location intentionally omitted — no Azure Functions API
        env:
          # Vite env vars injected at build time via the SWA action's build environment.
          # MUST be set as repo variables (public) or repo secrets for production.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://advisor-agent-app.wittysea-86254dbc.swedencentral.azurecontainerapps.io' }}
          VITE_ADVISOR_CLIENT_ID: ${{ vars.VITE_ADVISOR_CLIENT_ID || '4f4f4a4d-e60f-4b86-a681-86059aae4597' }}
          VITE_ADVISOR_TENANT_ID: ${{ vars.VITE_ADVISOR_TENANT_ID || 'cdfe81b5-821e-4f07-9ea7-516efc8497e4' }}
          VITE_AZURE_REDIRECT_URI: ${{ vars.VITE_AZURE_REDIRECT_URI || 'https://polite-mushroom-0a09fa803.7.azurestaticapps.net' }}

  close_pull_request_job:
    name: Close Pull Request Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
          app_location: 'advisor-agent/web'
