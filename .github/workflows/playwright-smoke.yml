# Playwright SPA Smoke Tests — advisor-agent
#
# Runs the Playwright e2e suite against the deployed SPA + API.
# Triggered manually (workflow_dispatch) for M2 stability; promote to
# pull_request trigger once secrets are provisioned and tests are stable.
#
# ─── Required GitHub Secrets ────────────────────────────────────────────────
#
#   E2E_SP_CLIENT_ID     — Service-principal client ID for the smoke-test SP.
#                          SP must have the Advisor.Smoke app role on the API
#                          app registration (4f4f4a4d-e60f-4b86-a681-86059aae4597).
#
#   E2E_SP_CLIENT_SECRET — SP client secret (rotate every 90 days).
#
#   E2E_SP_TENANT_ID     — Entra tenant ID: cdfe81b5-821e-4f07-9ea7-516efc8497e4
#
#   SPA_BASE_URL         — Deployed SWA URL.
#                          e.g. https://polite-mushroom-0a09fa803.7.azurestaticapps.net
#
#   API_BASE_URL         — Deployed Container App API base URL.
#                          e.g. https://advisor-agent-app.delightfulsea-3191f7a0.swedencentral.azurecontainerapps.io
#
# ─── Entra prerequisites (Parker / infra owner) ─────────────────────────────
# See .squad/decisions/inbox/brett-playwright-spa-smoke.md for the exact
# az CLI commands to provision the smoke-test SP and grant it the app role.
#
# ─── Promote to PR trigger ───────────────────────────────────────────────────
# When stable, change the trigger to:
#   on:
#     pull_request:
#       paths:
#         - 'advisor-agent/web/**'
#         - 'advisor-agent/agent/**'

name: Playwright SPA Smoke

on:
  workflow_dispatch:
    inputs:
      spa_base_url:
        description: 'Override SPA_BASE_URL (leave blank to use secret)'
        required: false
        default: ''

jobs:
  smoke:
    name: SPA Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: advisor-agent/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: advisor-agent/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          E2E_SP_CLIENT_ID:     ${{ secrets.E2E_SP_CLIENT_ID }}
          E2E_SP_CLIENT_SECRET: ${{ secrets.E2E_SP_CLIENT_SECRET }}
          E2E_SP_TENANT_ID:     ${{ secrets.E2E_SP_TENANT_ID }}
          # Prefer manual override (workflow_dispatch input) over repository secret
          SPA_BASE_URL: ${{ inputs.spa_base_url || secrets.SPA_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: advisor-agent/web/playwright-report/
          retention-days: 14
